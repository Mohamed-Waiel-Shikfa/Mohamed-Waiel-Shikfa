name: Refresh profile artwork

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/refresh-profile.yml'

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check updater behavior
        run: python -m unittest discover -s tests -v
      - name: Verify the pendulum model
        run: node tests/physics.test.cjs
      - name: Refresh public repository snapshot and SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_activity.py
      - name: Measure changed public repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cloc
          python scripts/refresh_code_metrics.py
      - name: Count authored public commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/refresh_commit_counts.py
      - name: Commit artwork when it changes
        run: |
          git add assets/ data/public-activity.json data/public-extras.json data/repo-code-metrics.json data/repo-contributions.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh public profile snapshot'
          git push
