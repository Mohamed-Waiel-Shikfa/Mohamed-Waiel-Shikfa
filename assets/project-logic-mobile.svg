iddle">0 ⊕ 0 = 0</text></g><g class="anim logic-state-1" opacity="0"><path d="M176 113H269" fill="none" stroke="#a8bcc8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" /><circle cx="169" cy="113" r="14" fill="#090e1b" stroke="#a8bcc8" stroke-width="1.2"/><text x="169" y="118" fill="#a8bcc8" font-size="16" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">0</text><path d="M176 169H269" fill="none" stroke="#91f2cc" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="169" cy="169" r="14" fill="#090e1b" stroke="#91f2cc" stroke-width="1.2"/><text x="169" y="174" fill="#91f2cc" font-size="16" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">1</text><path d="M381 141H455" fill="none" stroke="#91f2cc" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="468" cy="141" r="17" fill="#090e1b" stroke="#91f2cc" stroke-width="1.5"/><text x="468" y="147" fill="#91f2cc" font-size="19" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">1</text><text x="320" y="224" fill="#91f2cc" font-size="15" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">0 ⊕ 1 = 1</text></g><g class="anim logic-state-2" opacity="0"><path d="M176 113H269" fill="none" stroke="#91f2cc" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="169" cy="113" r="14" fill="#090e1b" stroke="#91f2cc" stroke-width="1.2"/><text x="169" y="118" fill="#91f2cc" font-size="16" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">1</text><path d="M176 169H269" fill="none" stroke="#a8bcc8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" /><circle cx="169" cy="169" r="14" fill="#090e1b" stroke="#a8bcc8" stroke-width="1.2"/><text x="169" y="174" fill="#a8bcc8" font-size="16" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">0</text><path d="M381 141H455" fill="none" stroke="#91f2cc" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="468" cy="141" r="17" fill="#090e1b" stroke="#91f2cc" stroke-width="1.5"/><text x="468" y="147" fill="#91f2cc" font-size="19" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">1</text><text x="320" y="224" fill="#91f2cc" font-size="15" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">1 ⊕ 0 = 1</text></g><g class="anim logic-state-3" opacity="0"><path d="M176 113H269" fill="none" stroke="#91f2cc" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="169" cy="113" r="14" fill="#090e1b" stroke="#91f2cc" stroke-width="1.2"/><text x="169" y="118" fill="#91f2cc" font-size="16" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">1</text><path d="M176 169H269" fill="none" stroke="#91f2cc" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><circle cx="169" cy="169" r="14" fill="#090e1b" stroke="#91f2cc" stroke-width="1.2"/><text x="169" y="174" fill="#91f2cc" font-size="16" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">1</text><path d="M381 141H455" fill="none" stroke="#a8bcc8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" /><circle cx="468" cy="141" r="17" fill="#090e1b" stroke="#a8bcc8" stroke-width="1.5"/><text x="468" y="147" fill="#a8bcc8" font-size="19" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">0</text><text x="320" y="224" fill="#a8bcc8" font-size="15" font-family="DejaVu Sans Mono,monospace" text-anchor="middle">1 ⊕ 1 = 0</text></g><text x="141" y="81" fill="#a8bcc8" font-size="10" font-family="DejaVu Sans Mono,monospace" >INPUTS</text><text x="442" y="81" fill="#a8bcc8" font-size="10" font-family="DejaVu Sans Mono,monospace" >OUTPUT</text></g><text x="18" y="225" fill="#edf5f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-1">Logic gates</text><t