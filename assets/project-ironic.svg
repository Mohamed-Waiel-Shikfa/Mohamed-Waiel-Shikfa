<svg xmlns="http://www.w3.org/2000/svg" width="640" height="405" viewBox="0 0 640 405" role="img" aria-labelledby="title desc">
<title id="title">OpenStack Ironic</title><desc id="desc">COURSEWORK / SUMMER OF CODE Real-world infrastructure, built together. Bare-metal provisioning and the OpenStack SDK. PYTHON / OPEN SOURCE</desc>
<style>
.type-reveal{transform-origin:42px 0;animation:type-reveal 7s steps(30,end) infinite}@keyframes type-reveal{0%,8%{transform:scaleX(0)}52%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.flow{stroke-dasharray:5 10;animation:flow 8s linear infinite}
.float{animation:float 6s ease-in-out infinite}
.spin{animation:spin .65s linear infinite}
.scan{animation:scan 7s ease-in-out infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.eq{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.6s ease-in-out infinite alternate}
.game-ball{animation:game-ball 6s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-120}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%,100%{transform:translateY(-48px);opacity:.25}50%{transform:translateY(48px);opacity:.85}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes game-ball{0%,100%{transform:translate(0,0)}30%{transform:translate(43px,-22px)}65%{transform:translate(73px,12px)}}
@media(prefers-reduced-motion:reduce){.anim{animation:none!important}}
</style>
<defs>
 <radialGradient id="glow"><stop stop-color="#91f2cc" stop-opacity=".14"/><stop offset="1" stop-color="#090e1b" stop-opacity="0"/></radialGradient>
 <radialGradient id="violet"><stop stop-color="#b5a4ff" stop-opacity=".13"/><stop offset="1" stop-color="#090e1b" stop-opacity="0"/></radialGradient>
 <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11182c"/><stop offset=".48" stop-color="#090e1b"/><stop offset="1" stop-color="#0b1b25"/></linearGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a8bcc8" opacity=".13"/></pattern>
 <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<defs><clipPath id="panel-clip"><rect x="1" y="1" width="638" height="403" rx="20"/></clipPath></defs><g clip-path="url(#panel-clip)"><rect x="1" y="1" width="638" height="403" rx="20" fill="url(#silk)" stroke="#2a3a50"/><ellipse cx="531.1999999999999" cy="105.3" rx="268.8" ry="291.59999999999997" fill="url(#violet)"/><ellipse cx="480.0" cy="364.5" rx="275.2" ry="247.04999999999998" fill="url(#glow)"/><path d="M288.00 403C460.80 263.25 320.00 137.70 638 20.25" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M309.76 403C473.60 263.25 342.40 137.70 638 42.53" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M331.52 403C486.40 263.25 364.80 137.70 638 64.80" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M353.28 403C499.20 263.25 387.20 137.70 638 87.08" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M375.04 403C512.00 263.25 409.60 137.70 638 109.35" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M396.80 403C524.80 263.25 432.00 137.70 638 131.62" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M418.56 403C537.60 263.25 454.40 137.70 638 153.90" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><rect x="2" y="2" width="636" height="401" rx="19" fill="#edf5f1" filter="url(#grain)" opacity=".025"/></g><text x="26" y="35" fill="#ffc183" font-family="DejaVu Sans Mono, monospace" font-size="13" font-weight="400" >12 / COURSEWORK / SUMMER OF CODE</text><style>
.bear-left{animation:bear-left 4.8s ease-in-out infinite;transform-origin:286px 136px}
.bear-right{animation:bear-right 4.8s ease-in-out infinite;transform-origin:354px 136px}
@keyframes bear-left{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(12deg)}}
@keyframes bear-right{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-12deg)}}
