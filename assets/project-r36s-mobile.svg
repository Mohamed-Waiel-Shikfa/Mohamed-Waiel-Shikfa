<svg xmlns="http://www.w3.org/2000/svg" width="300" height="470" viewBox="0 0 300 470" role="img" aria-labelledby="title desc">
<title id="title">CMU Graphics on R36S</title><desc id="desc">GRAPHICS / HANDHELD HARDWARE The same Python games, now in your hands. Porting, input mapping, and rendering optimizations. PYTHON / DARKOS</desc>
<style>
.type-reveal{transform-origin:42px 0;animation:type-reveal 7s steps(30,end) infinite}@keyframes type-reveal{0%,8%{transform:scaleX(0)}52%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.flow{stroke-dasharray:5 10;animation:flow 8s linear infinite}
.float{animation:float 6s ease-in-out infinite}
.spin{animation:spin .65s linear infinite}
.scan{animation:scan 7s ease-in-out infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
.eq{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.6s ease-in-out infinite alternate}
.game-ball{animation:game-ball 6s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-120}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{0%,100%{transform:translateY(-48px);opacity:.25}50%{transform:translateY(48px);opacity:.85}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes eq{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes game-ball{0%,100%{transform:translate(0,0)}30%{transform:translate(43px,-22px)}65%{transform:translate(73px,12px)}}
@media(prefers-reduced-motion:reduce){.anim{animation:none!important}}
</style>
<defs>
 <radialGradient id="glow"><stop stop-color="#91f2cc" stop-opacity=".14"/><stop offset="1" stop-color="#090e1b" stop-opacity="0"/></radialGradient>
 <radialGradient id="violet"><stop stop-color="#b5a4ff" stop-opacity=".13"/><stop offset="1" stop-color="#090e1b" stop-opacity="0"/></radialGradient>
 <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11182c"/><stop offset=".48" stop-color="#090e1b"/><stop offset="1" stop-color="#0b1b25"/></linearGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch" seed="7"/><feColorMatrix type="saturate" values="0"/></filter>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#a8bcc8" opacity=".13"/></pattern>
 <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<defs><clipPath id="panel-clip"><rect x="1" y="1" width="298" height="468" rx="20"/></clipPath></defs><g clip-path="url(#panel-clip)"><rect x="1" y="1" width="298" height="468" rx="20" fill="url(#silk)" stroke="#2a3a50"/><ellipse cx="249.0" cy="122.2" rx="126.0" ry="338.4" fill="url(#violet)"/><ellipse cx="225.0" cy="423.0" rx="129.0" ry="286.7" fill="url(#glow)"/><path d="M135.00 468C216.00 305.50 150.00 159.80 298 23.50" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M145.20 468C222.00 305.50 160.50 159.80 298 49.35" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M155.40 468C228.00 305.50 171.00 159.80 298 75.20" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M165.60 468C234.00 305.50 181.50 159.80 298 101.05" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M175.80 468C240.00 305.50 192.00 159.80 298 126.90" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M186.00 468C246.00 305.50 202.50 159.80 298 152.75" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><path d="M196.20 468C252.00 305.50 213.00 159.80 298 178.60" fill="none" stroke="#b5a4ff" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" opacity=".07"/><rect x="2" y="2" width="296" height="466" rx="19" fill="#edf5f1" filter="url(#grain)" opacity=".025"/></g><text x="18" y="35" fill="#b5a4ff" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="400" >07 / GRAPHICS</text><g transform="translate(-10 25) scale(.50)"><rect x="225" y="53" width="190" height="185" rx="20" fill="#121c2e" stroke="#b5a4ff" stroke-width="1.6"/><rect x="246" y="68" width="148" height="91" rx="6" fill="#090e1b" stroke="#2a3a50"/><path d="M254 144h27v-15h28v15h37v-25h40" fill="none" stroke="#91f2cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="anim game-ball"><circle cx="275.00" cy="109.00" r="5" fill="#ffc183" /></g><path d="M265 175v29M250 190h30" fill="none" stroke="#a8bcc8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><circle cx="371.00" cy="178.00" r="5" fill="#91f2cc" /><circle cx="386.00" cy="192.00" r="5" fill="#ffc183" /><circle cx="355.00" cy="192.00" r="5" fill="#b5a4ff" /><circle cx="371.00" cy="206.00" r="5" fill="#a8bcc8" /><rect x="303" y="197" width="11" height="4" rx="2" fill="#a8bcc8"/><rect x="323" y="197" width="11" height="4" rx="2" fill="#a8bcc8"/><text x="115" y="131" fill="#a8bcc8" font-family="DejaVu Sans Mono, monospace" font-size="11" font-weight="400" >PYTHON</text><path d="M159 141h43m-7-5 7 5-7 5" fill="none" stroke="#b5a4ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="anim pulse"/><text x="444" y="131" fill="#a8bcc8" font-family="DejaVu Sans Mono, monospace" font-size="11" font-weight="400" >PLAY</text><path d="M426 141h43m-7-5 7 5-7 5" fill="none" stroke="#91f2cc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="anim pulse"/></g><text x="18" y="225" fill="#edf5f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-1">CMU games on</text><text x="18" y="262" fill="#edf5f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="-1">R36S</text><text x="18" y="323" fill="#a8bcc8" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" >Python games.</text><text x="18" y="356" fill="#a8bcc8" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" >Real buttons.</text><text x="18" y="389" fill="#a8bcc8" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" >Handheld play.</text><path d="M18 420H282" fill="none" stroke="#2a3a50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="18" y="450" fill="#b5a4ff" font-family="DejaVu Sans Mono, monospace" font-size="17" font-weight="400" >PYTHON</text><text x="256" y="451" fill="#b5a4ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="400" >↗</text>
</svg>
