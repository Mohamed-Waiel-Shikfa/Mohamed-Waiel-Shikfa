t-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" >Pulse the coil. Switch the core. Keep the state.</text><g transform="translate(-14 180) scale(0.95)"><style>
.epm-on{animation:epm-on 12s steps(1) infinite;opacity:0}.epm-off{animation:epm-off 12s steps(1) infinite}
